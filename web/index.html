<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-message="html.codex.vibe.game.creator"></title>
  <link rel="stylesheet" href="/style.css"><script src="/message-catalog.js" defer></script><script src="/messages.js" defer></script><script src="/i18n.js" defer></script><script src="/app.js" defer></script><script src="/assets.js" defer></script><script src="/references.js" defer></script><script src="/workbench.js" defer></script><script src="/creator.js" defer></script><script src="/production.js" defer></script><script src="/gameplay.js" defer></script><script src="/sound-runtime.js" defer></script><script src="/studio.js" defer></script><script src="/live.js" defer></script>
</head>
<body>
  <aside id="left-panel" class="sidebar"><button id="toggle-left" class="panel-toggle" aria-controls="left-panel" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v16 M15 8l-4 4 4 4"/></svg></button><div id="resize-left" class="panel-resizer" role="separator" tabindex="0" aria-orientation="vertical" data-message-aria-label="ui.resize.left.panel"></div>
    <a class="brand" href="#" id="home-link"><span class="brand-mark" data-message="html.g"></span><span><span data-message="html.codex.vibe.game.creator"></span><small data-message="ui.your.game.workshop"></small></span></a>
    <button id="new-project" class="primary new-project" data-message="ui.new.project"></button>
    <div class="nav-label" data-message="ui.my.projects"></div><nav id="project-list" data-message-aria-label="ui.project.list"></nav>
    <div class="sidebar-bottom"><span class="local-dot"></span><span data-message="html.message"></span><small><span id="app-version"></span> · <a id="release-link" href="https://github.com/eunyoeongmin/codex-vibe-game-creator/releases/latest" target="_blank" rel="noreferrer" data-message="ui.download.updates"></a></small><small id="account-label" data-message="ui.checking.codex.connection"></small><button id="login" class="secondary" data-message="ui.sign.in.to.codex"></button><a id="login-link" target="_blank" rel="noreferrer" hidden data-message="ui.open.sign.in"></a><button id="sandbox-setup" hidden data-message="ui.retry.permission.setup"></button><small id="sandbox-status"></small></div>
  </aside>
  <main>
    <header id="top-panel" class="topbar"><button id="toggle-top" class="panel-toggle" aria-controls="top-panel" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16 M8 15l4-4 4 4"/></svg></button><div id="resize-top" class="panel-resizer" role="separator" tabindex="0" aria-orientation="horizontal" data-message-aria-label="ui.resize.top.panel"></div><div><div class="eyebrow" data-message="html.game.workspace"></div><h1 id="page-title" data-message="ui.where.ideas.become.games"></h1></div><div class="top-actions"><select id="language" data-message-aria-label="ui.interface.and.conversation.language"><option value="ko" data-message="html.message.2"></option><option value="en" data-message="html.english"></option><option value="ja" data-message="html.message.3"></option><option value="zh-Hans" data-message="html.message.4"></option><option value="zh-Hant" data-message="html.message.5"></option></select><button id="toggle-theme" aria-pressed="false" data-message="ui.dark.mode"></button><button id="usage-button" data-message="ui.usage"></button><span id="connection-state" class="pill" data-message="ui.select.a.project"></span><button id="folder" hidden data-message="ui.open.folder"></button></div></header>
    <div id="notice" role="status" hidden><span id="notice-text"></span><button id="reconnect" hidden data-message="ui.reconnect"></button></div>
    <section id="home">
      <div class="welcome"><div class="eyebrow" data-message="html.your.next.game.starts.here"></div><h2><span data-message="ui.what.game.do.you"></span><br><span data-message="ui.want.to.create"></span></h2><p><span data-message="ui.from.a.rough.idea.to.a.playable.game"></span><br><span data-message="ui.plan.build.and.refine.with.codex"></span></p><button id="welcome-create" class="primary"><span data-message="html.message.6"></span><span>↗</span></button></div>
      <div class="workflow"><div><span>01</span><h3 data-message="ui.name.it"></h3><p><span data-message="ui.create.a.project.and"></span><br><span data-message="ui.give.your.game.its.first.name"></span></p></div><div><span>02</span><h3 data-message="ui.shape.your.idea"></h3><p><span data-message="ui.through.conversation.and.choices"></span><br><span data-message="ui.decide.what.you.want.your.game.to.be"></span></p></div><div><span>03</span><h3 data-message="ui.build.and.play"></h3><p><span data-message="ui.see.file.changes.and.your.game"></span><br><span data-message="ui.together.in.one.workshop"></span></p></div></div>
      <div class="section-heading"><h3 data-message="ui.continue.creating"></h3><span id="project-count"></span></div><div id="project-cards"></div>
    </section>
    <section id="workspace" hidden>
      <div class="chat-panel"><div class="chat-toolbar"><span><i class="local-dot"></i><span data-message="html.codex"></span></span><select id="model" data-message-aria-label="ui.codex.model"><option value="" data-message="ui.default.codex.model"></option></select><select id="speed" data-message-aria-label="ui.response.speed"><option value="default" data-message="ui.standard.speed"></option></select><label class="effort-label"><span data-message="html.message.7"></span><select id="effort" data-message-aria-label="ui.model.reasoning.effort"></select></label><button id="connect" data-message="ui.connect"></button></div><div class="usage-strip"><span id="quota-brief" data-message="ui.usage.not.checked"></span><span id="context-brief" data-message="ui.context.awaiting.response"></span></div>
        <section id="work-status" data-message-aria-label="ui.current.work.status"></section><div class="conversation"><div id="history-loading" role="status" hidden><span id="history-loading-label"></span><progress data-message-aria-label="ui.loading.conversation.2"></progress><button id="history-retry" type="button" hidden data-message="ui.retry"></button></div><div id="messages" aria-live="polite"></div></div><div id="codex-activity" role="status" hidden><span class="activity-dot" aria-hidden="true"></span><strong data-message="html.codex.2"></strong><span id="codex-activity-label"></span></div><div id="questions"></div>
        <form id="composer"><div id="request-target"></div><div id="attachments"></div><textarea id="message" rows="3" data-message-placeholder="ui.describe.your.game.or.a.change.shift.enter" data-message-aria-label="ui.message.to.codex"></textarea><div class="composer-actions"><label class="attach-button"><span data-message="ui.attach.file"></span><input id="upload" type="file" multiple hidden></label><span id="working-label"></span><button id="stop" type="button" hidden data-message="ui.stop"></button><button id="send" class="primary" type="submit" data-message="ui.send"></button></div></form>
      </div>
      <div id="right-panel" class="inspector"><button id="toggle-right" class="panel-toggle" aria-controls="right-panel" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4v16 M9 8l4 4-4 4"/></svg></button><div id="resize-right" class="panel-resizer" role="separator" tabindex="0" aria-orientation="vertical" data-message-aria-label="ui.resize.right.panel"></div><div class="tabs" role="tablist"><button data-tab="progress" role="tab" data-message="ui.progress"></button><button data-tab="files" class="active" role="tab" data-message="ui.files"></button><button data-tab="assets" role="tab" data-message="ui.assets"></button><button data-tab="records" role="tab" data-message="ui.decisions"></button><button data-tab="preview" role="tab" data-message="ui.preview"></button><button data-tab="creator" role="tab" data-message="ui.creation.tools"></button><button data-tab="discards" role="tab" data-message="ui.discard.candidates"></button><button data-tab="environment" role="tab" data-message="ui.connection"></button></div>
        <section id="tab-progress" class="tab-content" hidden>
          <div class="pane-heading"><strong id="progress-title" data-message="ui.design.progress"></strong><span id="spec-version"></span></div>
          <button id="asset-attention" type="button" hidden></button><section id="production-progress" hidden>
            <strong id="milestone-count"></strong><progress id="milestone-bar" max="1" value="0" data-message-aria-label="ui.completed.milestone.ratio"></progress>
            <div id="current-milestone" class="record"></div><div id="milestone-list"></div>
          </section>
          <details id="planning-details" open><summary data-message="ui.design.decisions"></summary>
            <div class="pane-heading"><strong id="planning-count" data-message="ui.confirmed.categories"></strong></div><progress id="planning-bar" max="1" value="0" data-message-aria-label="ui.confirmed.category.ratio"></progress><div id="planning-checklist"></div>
            <button id="show-summary" data-message="ui.view.summary"></button><section id="planning-summary" class="summary-card" hidden><h3 data-message="ui.design.summary"></h3><div id="summary-items"></div><div class="summary-actions"><button id="summary-start" class="primary" data-message="ui.start.with.this"></button><button id="summary-more" data-message="ui.keep.planning"></button></div></section>
          </details>
        </section>
        <section id="tab-files" class="tab-content"><div class="pane-heading"><span data-message="ui.project.files"></span><button id="refresh-files" data-message="ui.refresh"></button></div><div id="file-list"></div><div id="editor-panel" hidden><div class="pane-heading"><span id="file-name"></span><button id="save-file" data-message="ui.save"></button></div><textarea id="editor" spellcheck="false" data-message-aria-label="ui.file.contents"></textarea></div></section>
        <section id="tab-assets" class="tab-content" hidden>
          <div class="pane-heading"><strong data-message="ui.asset.management"></strong><button id="asset-add" type="button" data-message="ui.add.asset"></button><button id="asset-refresh" type="button" data-message="ui.refresh"></button></div>
          <details class="record"><summary data-message="ui.confirmed.art.direction"></summary><div id="asset-art-decisions"></div></details><div class="asset-filters"><select id="asset-kind-filter" data-message-aria-label="ui.asset.type"></select><select id="asset-status-filter" data-message-aria-label="ui.asset.status"></select><input id="asset-search" data-message-placeholder="ui.search.name.use.or.group" data-message-aria-label="ui.search.assets"></div><div id="asset-list"></div>
        </section>
        <section id="tab-records" class="tab-content" hidden><div class="pane-heading"><span data-message="ui.project.records"></span><button id="refresh-records" data-message="ui.refresh"></button></div><div id="records"></div></section>
        <section id="tab-preview" class="tab-content" hidden><div class="preview-controls"><input id="preview-path" value="index.html" data-message-aria-label="ui.html.path.to.preview"><button id="preview-button" data-message="ui.open"></button></div><p class="muted" data-message="ui.run.an.html.game.for.games.requiring.a"></p><div id="preview-actions" hidden><a id="preview-link" target="_blank" rel="noopener noreferrer"></a><div class="preview-buttons"><button id="preview-copy" type="button" data-message="ui.copy.url"></button><button id="preview-live" type="button" data-message="live.workspace"></button><button id="preview-feedback" type="button" data-message="ui.play.feedback"></button><button id="preview-fullscreen" type="button" data-message="ui.fullscreen"></button></div><p class="muted" data-message="ui.open.this.url.in.another.browser.on.this"></p></div><iframe allowfullscreen id="preview-frame" data-message-title="ui.game.preview" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe></section>
        <section id="tab-creator" class="tab-content" hidden><div class="pane-heading"><strong data-message="ui.creation.tools"></strong><button id="creator-refresh" data-message="ui.refresh"></button></div><nav id="creator-navigation"></nav><p id="creator-status" role="status"></p><div id="creator-body"></div></section><section id="tab-discards" class="tab-content" hidden><div class="pane-heading"><strong data-message="ui.discard.candidates"></strong><button id="discard-refresh" data-message="ui.refresh"></button></div><p id="discard-total"></p><details><summary data-message="ui.register.a.candidate"></summary><form id="discard-form"><label><span data-message="ui.project.relative.path"></span><input id="discard-path" required></label><label><span data-message="ui.reason.for.discarding"></span><textarea id="discard-reason" required maxlength="4000"></textarea></label><button type="submit" data-message="ui.register.candidate"></button></form></details><div id="discard-list"></div></section><section id="tab-environment" class="tab-content" hidden><h3 data-message="ui.current.project.connection"></h3><div id="environment"></div><h3 data-message="ui.sent.instructions"></h3><div id="instruction-history"></div><details><summary data-message="ui.automatic.startup.instructions"></summary><p data-message="ui.the.first.conversation.reads.agents.md.and.asks"></p></details></section>
      </div>
    </section>
  </main>
  <dialog id="create-dialog"><form id="create-form"><div class="eyebrow" data-message="html.new.project"></div><h2 data-message="ui.what.is.your.game.s.name"></h2><p class="muted" data-message="ui.projects.are.stored.separately.even.when.they.share"></p><label for="project-name" data-message="ui.project.name"></label><input id="project-name" maxlength="100" required data-message-placeholder="ui.e.g.the.star.collecting.cat" autocomplete="off"><div class="dialog-actions"><button id="cancel-create" type="button" data-message="ui.cancel"></button><button id="create-submit" class="primary" type="submit" data-message="ui.create.project"></button></div></form></dialog>
  <dialog id="usage-dialog"><div class="eyebrow" data-message="html.codex.usage"></div><h2 data-message="ui.usage.and.context"></h2><div id="quota-details"></div><h3 data-message="ui.current.conversation"></h3><div id="context-details" class="muted" data-message="ui.select.a.project.2"></div><div class="dialog-actions"><button id="refresh-usage" data-message="ui.refresh"></button><button id="close-usage" class="primary" data-message="ui.close"></button></div></dialog>
<dialog id="asset-dialog">
    <div class="pane-heading"><h2 id="asset-title" data-message="ui.add.asset"></h2><button id="asset-close" type="button" data-message="ui.close"></button></div>
    <div id="asset-media"></div>
    <form id="asset-form">
      <label for="asset-name" data-message="ui.asset.name"></label><input id="asset-name" required maxlength="200">
      <div class="asset-grid"><label><span data-message="ui.type"></span><select id="asset-kind"></select></label><label><span data-message="ui.status"></span><select id="asset-status"></select></label><label><span data-message="ui.usage.state"></span><select id="asset-usage-state"></select></label></div>
      <label for="asset-group" data-message="ui.group.free.text"></label><input id="asset-group">
      <label for="asset-usage" data-message="ui.where.and.when.it.is.used"></label><textarea id="asset-usage" rows="2" required></textarea>
      <fieldset><legend data-message="ui.creation.method.multiple.allowed"></legend><div id="asset-methods"></div></fieldset>
      <label for="asset-art-notes" data-message="ui.art.direction.production.details"></label><textarea id="asset-art-notes" rows="3"></textarea>
      <label for="asset-reason" data-message="ui.choice.rationale.explain.mixed.methods"></label><textarea id="asset-reason" rows="2" required></textarea>
      <label for="asset-replacement-plan" data-message="ui.temporary.asset.replacement.plan"></label><textarea id="asset-replacement-plan" rows="2"></textarea>
      <label for="asset-files" data-message="ui.file.code.paths.one.per.line"></label><textarea id="asset-files" rows="3"></textarea>
      <label class="attach-button"><span data-message="ui.add.file"></span><input id="asset-upload" type="file" hidden></label><p class="muted" data-message="ui.change.the.paths.in.the.list.to.replace"></p>
      <details><summary data-message="ui.sources.linked.records"></summary>
        <div id="asset-link-decisions"></div>
        <label for="asset-source-note" data-message="ui.source.tool.generation.details.or.code.location"></label><textarea id="asset-source-note" rows="3"></textarea>
        <label for="asset-decision-ids" data-message="ui.decision.ids.one.per.line"></label><textarea id="asset-decision-ids" rows="2"></textarea>
        <label for="asset-reference-ids" data-message="ui.reference.ids.one.per.line"></label><textarea id="asset-reference-ids" rows="2"></textarea>
      </details>
      <label for="asset-change-note" data-message="ui.reason.for.this.addition.change"></label><textarea id="asset-change-note" rows="2" required></textarea>
      <p class="muted" data-message="ui.saving.as.confirmed.records.your.selection.of.this"></p>
      <div class="dialog-actions"><button id="asset-save" class="primary" type="submit" data-message="ui.save"></button></div>
    </form>
    <section id="asset-request-panel" hidden><h3 data-message="ui.request.an.ai.edit"></h3><p class="muted" data-message="ui.requests.use.the.saved.asset.save.any.edits"></p><textarea id="asset-request-text" rows="3" data-message-aria-label="ui.asset.change.request"></textarea><button id="asset-request-send" type="button" data-message="ui.send.change.request"></button></section>
    <button id="asset-history-button" type="button" data-message="ui.change.history"></button><div id="asset-history"></div>
  </dialog>
<dialog id="creator-dialog"><div class="pane-heading"><h2 id="creator-dialog-title"></h2><button id="creator-dialog-close" type="button" data-message="ui.close"></button></div><div id="creator-dialog-body"></div></dialog>
</body>
</html>
